name: CustomizeYouProfile
description: Animated effects for your GitHub profile README, drawn from your own contributions and refreshed daily.
author: qwerty-ll
branding:
  icon: star
  color: purple

inputs:
  effects:
    description: "Comma-separated effect ids, or `all`: intro, skills, rpg-card, languages, dino-run, fireworks, black-hole, oscilloscope, terminal, notebook, space-shooter, countdown"
    default: dino-run
  login:
    description: GitHub user whose contributions are drawn. Defaults to the repository owner.
    default: ""
  name:
    description: Display name for `intro` (defaults to your GitHub name).
    default: ""
  tagline:
    description: Lines typed in `intro`, separated by `|`, e.g. "Frontend dev|Game jams|Coffee".
    default: ""
  skills:
    description: Comma-separated tech stack for `skills` (defaults to your top languages).
    default: ""
  seasons:
    description: "Opt-in seasonal looks: `new-year` (Dec 15 – Jan 10), `halloween` (Oct 24 – Nov 1), `all`, or empty for none."
    default: ""
  birthday:
    description: Your birthday as MM-DD (e.g. 03-15). On that day every effect gets confetti and a "Happy birthday". Empty = off.
    default: ""
  countdown:
    description: 'Up to 3 dates, separated by `;`: "2026-12-31 Release; 2027-06-01 Vacation; birthday". Adds a countdown card. Empty = off.'
    default: ""
  today:
    description: Pretend today is this date (YYYY-MM-DD). Only for previewing seasonal modes.
    default: ""
  output-dir:
    description: Folder (relative to the repository root) where the SVG files are written.
    default: profile-effects
  readme:
    description: README file to add the images to. Created if it does not exist.
    default: README.md
  readme-position:
    description: Where the image block goes the first time (`top` or `bottom`). Later runs update it in place.
    default: top
  update-readme:
    description: Set to `false` to only write the SVG files and leave the README alone.
    default: "true"
  language:
    description: Language for text inside effects that have it (notebook). `en` or `ru`.
    default: en
  commit:
    description: Commit and push the result. Set to `false` to handle that yourself.
    default: "true"
  commit-message:
    description: Commit message for the update.
    default: Update profile effects
  token:
    description: Token used to read contributions. The default token only sees public activity.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Generate effects
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        IN_LOGIN: ${{ inputs.login }}
        IN_EFFECTS: ${{ inputs.effects }}
        IN_OUT: ${{ inputs.output-dir }}
        IN_README: ${{ inputs.readme }}
        IN_POSITION: ${{ inputs.readme-position }}
        IN_UPDATE_README: ${{ inputs.update-readme }}
        IN_LANGUAGE: ${{ inputs.language }}
        IN_NAME: ${{ inputs.name }}
        IN_TAGLINE: ${{ inputs.tagline }}
        IN_SKILLS: ${{ inputs.skills }}
        IN_SEASONS: ${{ inputs.seasons }}
        IN_BIRTHDAY: ${{ inputs.birthday }}
        IN_COUNTDOWN: ${{ inputs.countdown }}
        IN_TODAY: ${{ inputs.today }}
      run: |
        args=(--login "${IN_LOGIN:-$GITHUB_REPOSITORY_OWNER}" --effects "$IN_EFFECTS" --out "$IN_OUT"
              --readme "$IN_README" --readme-position "$IN_POSITION" --language "$IN_LANGUAGE"
              "--name=$IN_NAME" "--tagline=$IN_TAGLINE" "--skills=$IN_SKILLS"
              "--seasons=$IN_SEASONS" "--birthday=$IN_BIRTHDAY" "--countdown=$IN_COUNTDOWN" "--today=$IN_TODAY")
        [ "$IN_UPDATE_README" = "false" ] && args+=(--no-readme)
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${args[@]}"

    - name: Commit and push
      if: inputs.commit == 'true'
      shell: bash
      env:
        IN_OUT: ${{ inputs.output-dir }}
        IN_README: ${{ inputs.readme }}
        IN_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$IN_OUT"
        [ -f "$IN_README" ] && git add -- "$IN_README"
        if git diff --cached --quiet; then
          echo "Nothing changed."
          exit 0
        fi
        git commit -m "$IN_MESSAGE"
        # another run may have pushed meanwhile; our files are generated, so rebasing is safe
        git push || { git pull --rebase --autostash && git push; }
