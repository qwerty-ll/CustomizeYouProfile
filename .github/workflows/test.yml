name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/validate.mjs

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh test/install.test.sh
      - run: bash test/install.test.sh
      - name: Same on bash 3.2, the version macOS ships
        run: docker run --rm -v "$PWD:/w" -w /w bash:3.2 bash test/install.test.sh
